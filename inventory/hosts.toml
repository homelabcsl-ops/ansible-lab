[dks.hosts.dks-lab-elite]
ansible_host = "127.0.0.1"
ansible_port = 2222
ansible_user = "homelab.linux"
ansible_ssh_common_args = "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

[rhcsa.hosts.rhcsa-lab]
ansible_host = "127.0.0.1"
ansible_user = "homelab.linux"
ansible_ssh_common_args = "-F ~/.lima/rhcsa-lab/ssh.config -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
