---
- name: DevOps Idempotent Pave Sequence
  hosts: rhcsa_lab
  vars:
    user_name: '{{ ansible_user }}'
    user_home: '/home/{{ ansible_user }}.linux'

  tasks:
    - name: Provision core Red Hat system packages
      become: true
      ansible.builtin.dnf:
        name:
          - glibc-langpack-en
          - ncurses-term
          - git
          - zsh
          - make
          - gcc
          - unzip
          - gettext
          - curl
          - wget
          - tar
          - util-linux-user
          - readline-devel
        state: present

    - name: Enforce sterile RHCSA baseline (Purge Tmux)
      become: true
      ansible.builtin.dnf:
        name: tmux
        state: absent

    - name: Enforce strict UTF-8 locale for Unicode rendering
      become: true
      ansible.builtin.command: localectl set-locale LANG=en_GB.UTF-8
      changed_when: false

    - name: Enable Extra Packages for Enterprise Linux (EPEL)
      ansible.builtin.dnf:
        name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
        state: present
        disable_gpg_check: true
      become: true
      register: epel_status

    - name: Force DNF cache refresh (Only on new EPEL install)
      ansible.builtin.dnf:
        update_cache: true
      become: true
      when: epel_status.changed # noqa: no-handler

    # ==============================================================================
    # 🛡️ RHCSA PROFESSIONAL TEST ENVIRONMENT
    # ==============================================================================

    - name: Install essential RHCSA system administration utilities
      become: true
      ansible.builtin.dnf:
        name:
          # Security & SELinux
          - policycoreutils-python-utils
          - firewalld
          - setroubleshoot-server
          # Advanced Storage Management
          - lvm2
          - stratisd
          - stratis-cli
          - xfsprogs
          # System & Network Services
          - chrony
          - autofs
          - tuned
          - NetworkManager-tui
          # Archiving & Core Utilities (Deduplicated)
          - gzip
          - bzip2
          - bash-completion
        state: present

    - name: Ensure critical RHCSA daemons are enabled and running
      become: true
      ansible.builtin.systemd:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - firewalld
        - chronyd
        - tuned
        - stratisd

    # ==============================================================================
    # ⚡ CLI UTILITIES & TERMINAL ENVIRONMENT
    # ==============================================================================

    - name: Install modern EPEL-dependent CLI utilities
      ansible.builtin.dnf:
        name:
          - fzf
          - bat
          - fd-find
          - ripgrep
        state: present
        enablerepo: epel
      become: true

    - name: Download fzf-git.sh globally (Native Curl)
      become: true
      ansible.builtin.command:
        cmd: >
          curl -sSfL
          https://raw.githubusercontent.com/junegunn/fzf-git.sh/main/fzf-git.sh
          -o /usr/local/bin/fzf-git.sh
      args:
        creates: /usr/local/bin/fzf-git.sh
      # noqa command-instead-of-module

    - name: Ensure fzf-git.sh is executable
      become: true
      ansible.builtin.file:
        path: /usr/local/bin/fzf-git.sh
        mode: '0755'

    - name: Install Zoxide (Architecture Agnostic)
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh
        mv /root/.local/bin/zoxide /usr/local/bin/zoxide
      args:
        executable: /bin/bash
        creates: /usr/local/bin/zoxide
      # noqa command-instead-of-module

    - name: Ensure Zoxide is executable
      become: true
      ansible.builtin.file:
        path: /usr/local/bin/zoxide
        mode: '0755'

    - name: Install Starship
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        curl -sS https://starship.rs/install.sh | sh -s -- -y
      args:
        executable: /bin/bash
        creates: /usr/local/bin/starship
      # noqa command-instead-of-module

    # --- Eza Native Binary Deployment ---
    - name: Download official eza artifact (ARM64)
      become: true
      ansible.builtin.command:
        cmd: >
          curl -sL
          https://github.com/eza-community/eza/releases/download/v0.18.2/eza_aarch64-unknown-linux-gnu.tar.gz
          -o /tmp/eza_aarch64.tar.gz
      args:
        creates: /usr/local/bin/eza
      when: ansible_facts['architecture'] == 'aarch64'
      # noqa command-instead-of-module

    - name: Download official eza artifact (x86_64)
      become: true
      ansible.builtin.command:
        cmd: >
          curl -sL
          https://github.com/eza-community/eza/releases/download/v0.18.2/eza_x86_64-unknown-linux-gnu.tar.gz
          -o /tmp/eza_x86_64.tar.gz
      args:
        creates: /usr/local/bin/eza
      when: ansible_facts['architecture'] == 'x86_64'
      # noqa command-instead-of-module

    - name: Extract eza binary to /tmp (ARM64)
      become: true
      ansible.builtin.unarchive:
        src: /tmp/eza_aarch64.tar.gz
        dest: /tmp
        remote_src: true
        creates: /usr/local/bin/eza
      when:
        - ansible_facts['architecture'] == 'aarch64'
        - not ansible_check_mode

    - name: Extract eza binary to /tmp (x86_64)
      become: true
      ansible.builtin.unarchive:
        src: /tmp/eza_x86_64.tar.gz
        dest: /tmp
        remote_src: true
        creates: /usr/local/bin/eza
      when:
        - ansible_facts['architecture'] == 'x86_64'
        - not ansible_check_mode

    - name: Install eza globally
      become: true
      ansible.builtin.command: mv /tmp/eza /usr/local/bin/eza
      args:
        creates: /usr/local/bin/eza

    - name: Download official stable Neovim artifact (v0.11.5)
      become: true
      ansible.builtin.command:
        cmd: >
          curl -sL
          https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-arm64.tar.gz
          -o /tmp/nvim-linux-arm64.tar.gz
      args:
        creates: /tmp/nvim-linux-arm64.tar.gz
      # noqa command-instead-of-module

    - name: Extract Neovim to /opt (ARM64)
      become: true
      ansible.builtin.unarchive:
        src: /tmp/nvim-linux-arm64.tar.gz
        dest: /opt
        remote_src: true
      when: ansible_facts['architecture'] == 'aarch64'

    - name: Extract Neovim to /opt (x86_64)
      become: true
      ansible.builtin.unarchive:
        src: /tmp/nvim-linux64.tar.gz
        dest: /opt
        remote_src: true
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Standardize Neovim directory name (ARM64)
      become: true
      ansible.builtin.command: mv /opt/nvim-linux-arm64 /opt/nvim
      args:
        creates: /opt/nvim
      when: ansible_facts['architecture'] == 'aarch64'

    - name: Standardize Neovim directory name (x86_64)
      become: true
      ansible.builtin.command: mv /opt/nvim-linux64 /opt/nvim
      args:
        creates: /opt/nvim
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Create global Neovim symlink
      become: true
      ansible.builtin.file:
        src: /opt/nvim/bin/nvim
        dest: /usr/local/bin/nvim
        state: link

    - name: Ensure user local hierarchy exists
      become: true
      ansible.builtin.file:
        path: '{{ user_home }}/.local'
        state: directory
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        mode: '0755'

    - name: Provision user-space Node.js v20 LTS (ARM64)
      become: true
      ansible.builtin.unarchive:
        src: https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-arm64.tar.xz
        dest: '{{ user_home }}/.local'
        remote_src: true
        extra_opts:
          - --strip-components=1
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        creates: '{{ user_home }}/.local/bin/node'
      when: ansible_facts['architecture'] == 'aarch64'

    - name: Provision user-space Node.js v20 LTS (x86_64)
      become: true
      ansible.builtin.unarchive:
        src: https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz
        dest: '{{ user_home }}/.local'
        remote_src: true
        extra_opts:
          - --strip-components=1
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        creates: '{{ user_home }}/.local/bin/node'
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Enforce default shell to Bash for RHCSA exam parity
      become: true
      ansible.builtin.user:
        name: '{{ user_name }}'
        shell: /bin/bash

    - name: Ensure target configuration directories exist
      become: true
      ansible.builtin.file:
        path: '{{ user_home }}/.config/starship'
        state: directory
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        mode: '0755'

    - name: Deploy Starship telemetry configuration to hypervisor
      become: true
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/.config/starship/starship.toml"
        dest: '{{ user_home }}/.config/starship/starship.toml'
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        mode: '0644'

    - name: '[PAUSED] Initialize Starship engine in Target Zshrc'
      become: true
      ansible.builtin.blockinfile:
        path: '{{ user_home }}/.zshrc'
        create: true
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        mode: '0644'
        marker: '# {mark} ANSIBLE MANAGED BLOCK: STARSHIP'
        state: absent

    # ==============================================================================
    # 🚀 DKS WORKSPACE & INFRASTRUCTURE SYNCHRONIZATION
    # ==============================================================================

    - name: Ensure DKS scripts directory exists
      become: true
      ansible.builtin.file:
        path: '{{ user_home }}/scripts'
        state: directory
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        mode: '0755'

    - name: Enforce strict architectural decoupling (Purge Ignition Payload)
      become: true
      ansible.builtin.file:
        path: '{{ user_home }}/scripts/dks-boot.sh'
        state: absent

    - name: Enforce sterile startup (Purge ghost script invocations)
      become: true
      ansible.builtin.lineinfile:
        path: '{{ item }}'
        regexp: 'dks-boot\.sh'
        state: absent
      loop:
        - '{{ user_home }}/.bashrc'
        - '{{ user_home }}/.bash_profile'
      failed_when: false

    - name: Deploy capture function to scripts directory
      become: true
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/.config/zsh/functions/cap.zsh"
        dest: '{{ user_home }}/scripts/cap.sh'
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        mode: '0755'

    - name: Inject capture function into Target Bashrc
      become: true
      ansible.builtin.blockinfile:
        path: '{{ user_home }}/.bashrc'
        create: true
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        mode: '0644'
        marker: '# {mark} ANSIBLE MANAGED BLOCK: CAPTURE FUNCTION'
        block: |
          # Enable frictionless workspace capture
          if [ -f "$HOME/scripts/cap.sh" ]; then
            source "$HOME/scripts/cap.sh"
          fi

    - name: Synchronize LazyVim Architecture via Delta-Transfer
      become: false
      ansible.posix.synchronize:
        src: "{{ lookup('env', 'HOME') }}/.config/nvim/"
        dest: '{{ user_home }}/.config/nvim/'
        archive: true
        checksum: true
        owner: false
        group: false
        perms: false
        rsync_opts:
          - '--exclude=.git'
          - '--exclude=.DS_Store'

    - name: Enforce deterministic architecture permissions
      become: true
      ansible.builtin.file:
        path: '{{ user_home }}/.config/nvim/'
        state: directory
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        recurse: true
        mode: 'u=rwX,g=rX,o=rX'

    - name: '[PAUSED] Inject CLI Aliases into Target Zshrc'
      become: true
      ansible.builtin.blockinfile:
        path: '{{ user_home }}/.zshrc'
        create: true
        owner: '{{ user_name }}'
        group: '{{ user_name }}'
        mode: '0644'
        marker: '# {mark} ANSIBLE MANAGED BLOCK: CLI ALIASES'
        state: absent
