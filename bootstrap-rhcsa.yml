---
- name: Scaffold RHCSA 1:1 Exam Parity Environment
  hosts: rhcsa
  become: true
  gather_facts: false

  tasks:
    - name: Set Exam FQDN Hostname
      ansible.builtin.hostname:
        name: node1.example.com

    - name: Wait for Red Hat CDN connectivity
      ansible.builtin.uri:
        url: https://cdn.redhat.com
        method: HEAD
      register: cdn_check
      retries: 20
      delay: 3
      until: cdn_check.status == 200
      ignore_errors: true

    - name: Register system with Red Hat Subscription Manager
      community.general.redhat_subscription:
        state: present
        username: '{{ rhsm_user }}'
        password: '{{ rhsm_pass }}'
        auto_attach: true
      when: cdn_check.status == 200

    - name: Install RHCSA Exam Toolchain & Virtualization Agents
      ansible.builtin.dnf:
        name:
          - qemu-guest-agent
          - bash-completion
          - podman
          - container-tools
          - lvm2
          - firewalld
          - NetworkManager
          - chrony
          - vim-enhanced
          - tmux
          - policycoreutils-python-utils
          - bind-utils
        state: present

    - name: Ensure target services are enabled and running
      ansible.builtin.systemd:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - qemu-guest-agent
        - firewalld
        - chronyd

    - name: Ensure SELinux is Enforcing
      ansible.posix.selinux:
        policy: targeted
        state: enforcing
