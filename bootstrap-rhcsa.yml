---
- name: Scaffold RHCSA 1:1 Exam Parity Environment
  hosts: rhcsa
  become: true
  gather_facts: false

  tasks:
    - name: Set Exam FQDN Hostname
      ansible.builtin.hostname:
        name: node1.example.com

    - name: Eradicate Image Builder artifact user (yr-lab)
      ansible.builtin.user:
        name: yr-lab
        state: absent
        remove: true
        force: true

    - name: Remove tsflags=nodocs from dnf.conf for 1:1 man-page parity
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^tsflags=nodocs'
        state: absent

    - name: Install RHCSA Exam Toolchain and Documentation (RHEL 10)
      ansible.builtin.dnf:
        name:
          - bash-completion
          - man-pages
          - man-db
          - kbd
          - podman
          - buildah
          - skopeo
          - lvm2
          - firewalld
          - NetworkManager
          - chrony
          - vim-enhanced
          - tmux
          - policycoreutils-python-utils
          - bind-utils
        state: present

    - name: Rebuild mandb index for offline search (man -k / apropos)
      ansible.builtin.command: mandb
      changed_when: false

    - name: Ensure target services are enabled and running
      ansible.builtin.systemd:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - firewalld
        - chronyd

    - name: Ensure SELinux is Enforcing
      ansible.posix.selinux:
        policy: targeted
        state: enforcing

    # --- TAILSCALE MESH INJECTION ---
    - name: Download Tailscale Installation Script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale_install.sh
        mode: '0700'

    - name: Execute Tailscale Installer
      ansible.builtin.command: /tmp/tailscale_install.sh
      args:
        creates: /usr/bin/tailscale

    - name: Enable and Start Tailscaled Service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check Tailscale Mesh State
      ansible.builtin.command: tailscale status
      register: ts_status
      changed_when: false
      failed_when: false

    - name: Authenticate Node to Tailscale Network (with Tailscale SSH)
      ansible.builtin.command: >
        tailscale up --authkey={{ tailscale_authkey }} --ssh
        --hostname=rhcsa-lab
      when: ts_status.rc != 0
      changed_when: true
