---
- name: Scaffold RHCSA 1:1 Exam Parity Environment
  hosts: rhcsa
  become: true
  gather_facts: false

  tasks:
    - name: Set Exam FQDN Hostname
      ansible.builtin.hostname:
        name: node1.example.com

    - name: Wait for Red Hat CDN connectivity
      ansible.builtin.uri:
        url: https://cdn.redhat.com
        method: HEAD
      register: cdn_check
      retries: 20
      delay: 3
      until: cdn_check.status == 200
      ignore_errors: true

    - name: Register system with Red Hat Subscription Manager
      community.general.redhat_subscription:
        state: present
        username: '{{ rhsm_user }}'
        password: '{{ rhsm_pass }}'
        auto_attach: true
      when: cdn_check.status == 200

    - name: Install RHCSA Exam Toolchain
      ansible.builtin.dnf:
        name:
          - qemu-guest-agent
          - bash-completion
          - podman
          - container-tools
          - lvm2
          - firewalld
          - NetworkManager
          - chrony
          - vim-enhanced
          - tmux
          - policycoreutils-python-utils
          - bind-utils
        state: present

    - name: Ensure target services are enabled and running
      ansible.builtin.systemd:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - qemu-guest-agent
        - firewalld
        - chronyd

    - name: Ensure SELinux is Enforcing
      ansible.posix.selinux:
        policy: targeted
        state: enforcing

    # --- MANAGEMENT PLANE PROVISIONING ---
    - name: Ensure homelab.linux user exists for DKS integration
      ansible.builtin.user:
        name: homelab.linux
        state: present
        groups: wheel
        append: true
        create_home: true
        shell: /bin/bash

    - name: Enforce passwordless sudo for homelab.linux
      ansible.builtin.copy:
        dest: /etc/sudoers.d/homelab_linux
        content: 'homelab.linux ALL=(ALL) NOPASSWD: ALL'
        mode: '0440'
        validate: 'visudo -cf %s'

    # --- TAILSCALE MESH INJECTION ---
    - name: Download Tailscale Installation Script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale_install.sh
        mode: '0700'

    - name: Execute Tailscale Installer
      ansible.builtin.command: /tmp/tailscale_install.sh
      args:
        creates: /usr/bin/tailscale

    - name: Enable and Start Tailscaled Service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Authenticate Node to Tailscale Network (with Tailscale SSH)
      ansible.builtin.command:
        tailscale up --authkey={{ tailscale_auth_key }} --ssh
        --hostname=rhcsa-lab
      args:
        creates: /var/lib/tailscale/tailscaled.state
