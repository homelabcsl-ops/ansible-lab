images:
  - location: 'https://dl.rockylinux.org/pub/rocky/9/images/aarch64/Rocky-9-GenericCloud-Base.latest.aarch64.qcow2'
    arch: 'aarch64'
vmType: 'qemu'
video:
  display: 'default'
cpus: 1
memory: '2GiB'
provision:
  - mode: system
    script: |
      #!/bin/bash
      # Unhide GRUB menu for RHCSA rd.break practice
      sed -i 's/GRUB_TIMEOUT=[0-9]*/GRUB_TIMEOUT=30/' /etc/default/grub
      sed -i 's/GRUB_TIMEOUT_STYLE=hidden/GRUB_TIMEOUT_STYLE=menu/' /etc/default/grub
      grub2-mkconfig -o /boot/grub2/grub.cfg
